name: Sync Fork with Upstream

# Uses SYNC_PAT (fine-grained PAT with Contents: Write + Workflows: Write)
# instead of GITHUB_TOKEN, because GITHUB_TOKEN cannot push workflow file
# changes from upstream (HTTP 422 "refusing to allow a GitHub App to create
# or update workflow ... without workflows permission").
#
# This repo has no rulesets on the default branch, so merge-upstream works
# directly (no PR + approval pattern needed).
#
# Prerequisites:
#   - Create a fine-grained PAT with `Contents: Read and Write` + `Workflows:
#     Read and Write`, scoped to this repo.
#   - Set it as the `SYNC_PAT` repository secret.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check SYNC_PAT secret is configured
        run: |
          if [ -z "${{ secrets.SYNC_PAT }}" ]; then
            echo "::error::SYNC_PAT secret is not set. Create a fine-grained PAT with 'Contents: Read and Write' + 'Workflows: Read and Write' scoped to this repo, then add it as the SYNC_PAT repository secret."
            exit 1
          fi

      - name: Sync default branch with upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          PARENT=$(gh api "repos/${{ github.repository }}" --jq '.parent.full_name // empty')

          if [ -z "$PARENT" ]; then
            echo "::notice::Not a fork — nothing to sync."
            exit 0
          fi

          UPSTREAM_DEFAULT=$(gh api "repos/$PARENT" --jq '.default_branch')
          FORK_HEAD=$(gh api "repos/${{ github.repository }}/branches/$DEFAULT_BRANCH" --jq '.commit.sha')
          UPSTREAM_HEAD=$(gh api "repos/$PARENT/branches/$UPSTREAM_DEFAULT" --jq '.commit.sha')

          if [ "$FORK_HEAD" = "$UPSTREAM_HEAD" ]; then
            echo "::notice::Fork is up to date with $PARENT — no sync needed."
            exit 0
          fi

          echo "::notice::Syncing $DEFAULT_BRANCH with $PARENT:$UPSTREAM_DEFAULT..."
          # Use SYNC_PAT (not GITHUB_TOKEN) because the PAT has Workflows: Write
          # permission, which GITHUB_TOKEN lacks. Without it, upstream changes
          # to .github/workflows/* are rejected with HTTP 422.
          gh api -X POST "repos/${{ github.repository }}/merge-upstream" \
            -f branch="$DEFAULT_BRANCH"
          echo "::notice::Sync complete."
